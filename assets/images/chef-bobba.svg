<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%">
      <stop offset="0%" stop-color="#1a2f45"/>
      <stop offset="100%" stop-color="#0d1b2a"/>
    </radialGradient>
  </defs>
  <rect width="600" height="800" fill="url(#bg)"/>
  <rect x="20" y="20" width="560" height="760" fill="none" stroke="#c9a55a" stroke-width="1" opacity="0.3"/>
  <!-- Simplified chef silhouette (toque + jacket) -->
  <ellipse cx="300" cy="230" rx="60" ry="70" fill="rgba(255,255,255,0.06)"/>
  <rect x="200" y="300" width="200" height="220" rx="8" fill="rgba(255,255,255,0.05)"/>
  <rect x="240" y="300" width="120" height="20" fill="rgba(201,165,90,0.15)"/>
  <!-- Name -->
  <text x="300" y="580" text-anchor="middle" font-family="Georgia,serif" font-size="36" font-weight="300" fill="#ffffff">Chef Bobba</text>
  <rect x="230" y="596" width="140" height="1" fill="#c9a55a"/>
  <text x="300" y="626" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#c9a55a" letter-spacing="4">EXECUTIVE CHEF</text>
  <text x="300" y="780" text-anchor="middle" font-family="Georgia,serif" font-size="14" font-style="italic" fill="rgba(201,165,90,0.18)">La Marée</text>
</svg>
